<h1 class="welcome-heading">{{ portalName }}</h1>
<p class="welcome-text">Track your courses, grades, and enrollment — all in one place.</p>
<div class="stats-row">
  <div class="stat"><span class="stat-value">12</span><span class="stat-label">Courses Available</span></div>
  <div class="stat"><span class="stat-value">3</span><span class="stat-label">Enrolled</span></div>
  <div class="stat"><span class="stat-value">3.8</span><span class="stat-label">GPA</span></div>
</div>
<button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
<p>{{ message }}</p>
<input [(ngModel)]="searchTerm" placeholder="Search courses...">
<p>Searching for: {{ searchTerm }}</p>
